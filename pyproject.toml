[project]
name = "kvbytepack"
version = "0.3.0"
description = "Bit-exact KV-cache compression and a cost model for when it pays"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy", "zstandard"]
authors = [{ name = "mynotwo" }]
keywords = ["kv-cache", "compression", "llm", "lossless", "inference"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://mynotwo.github.io/kvcache-bench/"

Repository = "https://github.com/mynotwo/kvbytepack"

[project.optional-dependencies]
codecs = ["lz4"]
capture = ["torch>=2.1", "transformers>=4.40"]
test = ["pytest"]

[tool.setuptools]
license-files = ["LICENSE"]
packages = ["kvbytepack", "kvbytepack.integrations"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

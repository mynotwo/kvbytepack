name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test,codecs]'
      - run: python -m kvbytepack selftest
      - run: python -m pytest -q tests
      - name: PyTorch dtypes (CPU wheel)
        if: matrix.python == '3.13'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_tensor.py
      - name: Pure-NumPy fallback (no C compiler)
        if: matrix.python == '3.13'
        run: |
          CC=false pip wheel . --no-deps -w "$RUNNER_TEMP/dist"
          pip install --force-reinstall --no-deps "$RUNNER_TEMP"/dist/kvbytepack-*.whl
          cd "$RUNNER_TEMP"
          python -c "from kvbytepack import layout; assert not layout.native_available()"
          python -m kvbytepack selftest
      - name: Benchmark smoke run on the bundled capture
        run: python -m kvbytepack bench data/qwen2.5-0.5b-bf16-kv.npz --repeats 1 --threads 2

name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Every gate lives in scripts/ci.sh so the same commands run locally.
      - name: Recompute archived results without third-party dependencies
        run: scripts/ci.sh results
      - run: scripts/ci.sh install
      - name: CPU entry without PyTorch
        run: scripts/ci.sh entry
      - name: AIBrix isolated contract and complete-record experiment
        if: matrix.python == '3.12'
        run: scripts/ci.sh evidence
      - run: scripts/ci.sh torch
        if: matrix.python == '3.12'
      - run: scripts/ci.sh test
      - name: Verify no-compiler wheel and source fallback
        if: matrix.python == '3.12'
        run: scripts/ci.sh fallback
      - name: Build and test the installed wheel outside the checkout
        run: scripts/ci.sh wheel
